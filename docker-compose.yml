services:
  go2rtc-config:
    build: .
    command: ["python", "-m", "streemcam", "render-go2rtc", "--out", "/go2rtc/go2rtc.yaml"]
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./go2rtc:/go2rtc

  go2rtc:
    image: alexxit/go2rtc:latest   # нужна версия >= 1.9.13 (xiaomi://); в образе есть curl для источников Tuya (echo:)
    depends_on:
      go2rtc-config:
        condition: service_completed_successfully
    volumes:
      - ./go2rtc:/config
    ports:
      - "127.0.0.1:1984:1984"   # WebUI только локально (вход в аккаунт Xiaomi)
      # раскомментируйте на VPS для WebRTC (и player_mode: webrtc,mse)
      # - "8555:8555/tcp"
      # - "8555:8555/udp"
    restart: unless-stopped

  streemcam:
    build: .
    env_file: .env
    depends_on: [go2rtc]
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./recordings:/recordings
    # 8081 (внутренний API для go2rtc) доступен только в docker-сети — не публикуйте его
    ports:
      - "127.0.0.1:8080:8080"   # локальная проверка; наружу — через cloudflared или caddy
    restart: unless-stopped
    stop_grace_period: 30s

  # Публикация наружу — один из профилей (COMPOSE_PROFILES в .env):
  #   cloudflared — Cloudflare Tunnel (домашний сервер без белого IP, DNS домена в Cloudflare)
  #   caddy       — HTTPS прямо на сервере с белым IP (VPS), сертификат Let's Encrypt
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["cloudflared"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [streemcam]
    restart: unless-stopped

  caddy:
    image: caddy:2
    profiles: ["caddy"]
    environment:
      STREEMCAM_DOMAIN: ${STREEMCAM_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [streemcam]
    restart: unless-stopped

  # P2P-туннели к камерам Imou через облако Easy4IP — как в приложении Imou Life: без роутеров, проброса
  # портов и трафика открытой платформы. Включается профилем p2p в COMPOSE_PROFILES; камеры —
  # DHP2P_CAMERAS в .env, в config.yaml это камеры type: dahua с host: dhp2p (README, «Камеры Imou через P2P»).
  dhp2p:
    build: deploy/dhp2p
    profiles: ["p2p"]
    environment:
      DHP2P_CAMERAS: ${DHP2P_CAMERAS:-}   # СЕРИЙНИК:ПОРТ через пробел
      DHP2P_RELAY: ${DHP2P_RELAY:-0}      # 1 — через relay-сервер, если прямое P2P не проходит
    restart: unless-stopped

  # WireGuard-сервер: дома (роутеры-клиенты) подключаются к нему, и go2rtc видит камеры в домашних сетях
  # напрямую, без облака. Включается профилем wireguard в COMPOSE_PROFILES; настройка — в README
  # («Камеры в домах через WireGuard»). Ключи и конфиги роутеров создаются в ./wireguard при первом запуске.
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    profiles: ["wireguard"]
    network_mode: host          # туннель и маршруты к домашним сетям — на самом сервере, их видят все контейнеры
    cap_add: [NET_ADMIN, SYS_MODULE]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Moscow
      SERVERURL: ${WG_SERVER_URL:-auto}     # белый IP или домен сервера; auto — определить самому
      SERVERPORT: "51820"
      PEERS: dom1,dom2,dom3                 # по конфигу на каждый дом: wireguard/peer_domN/peer_domN.conf
      INTERNAL_SUBNET: 10.13.13.0
      ALLOWEDIPS: 10.13.13.0/24             # роутеры шлют в туннель только ответы серверу, не весь интернет
      PERSISTENTKEEPALIVE_PEERS: all        # роутеры за NAT держат туннель открытым
      # домашняя сеть каждого дома: сервер направит её в туннель этого дома
      SERVER_ALLOWEDIPS_PEER_dom1: ${WG_LAN_DOM1:-}
      SERVER_ALLOWEDIPS_PEER_dom2: ${WG_LAN_DOM2:-}
      SERVER_ALLOWEDIPS_PEER_dom3: ${WG_LAN_DOM3:-}
    volumes:
      - ./wireguard:/config
      - ./deploy/wireguard/server.conf:/config/templates/server.conf:ro
      - /lib/modules:/lib/modules:ro
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
