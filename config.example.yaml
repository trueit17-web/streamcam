# Публичный HTTPS-адрес (hostname из Cloudflare Tunnel)
public_url: https://cams.example.com
secret: ${STREEMCAM_SECRET}

# Значения для docker-compose. Без Docker: listen_host 127.0.0.1,
# go2rtc_url http://127.0.0.1:1984, go2rtc_api_listen 127.0.0.1:1984
listen_host: 0.0.0.0
listen_port: 8080
go2rtc_url: http://go2rtc:1984
go2rtc_api_listen: ":1984"
player_mode: mse          # через туннель; на VPS с открытым 8555: "webrtc,mse"
max_transcodes: 2            # одновременных перекодировок «совместимого режима» (4 vCPU → 1–2)

# Внутренний API для go2rtc (только docker-сеть, наружу не публикуется)
internal_listen: "0.0.0.0:8081"
internal_url: http://streemcam:8081
internal_key: ${STREEMCAM_INTERNAL_KEY:-}

tuya:
  enabled: true              # камеры из Smart Life/Tuya Smart; вход — /tuya_login в Telegram
  refresh_minutes: 10
  snapshot_minutes: 15

imou:
  enabled: false             # камеры из аккаунта Imou Life через облако (только просмотр)
  app_id: ${IMOU_APP_ID:-}   # ключи с open.imoulife.com (тот же аккаунт, что в Imou Life)
  app_secret: ${IMOU_APP_SECRET:-}
  # api_url: https://openapi-fk.easy4ip.com/openapi   # если аккаунт в другом регионе
  refresh_minutes: 10
  snapshot_minutes: 15
  home: Город                # дом для всех камер Imou основного аккаунта (без строки — «Другие камеры»)
  # Камеры другого дома: облако отдаёт видео только по ключам аккаунта, к которому камера привязана,
  # поэтому владелец создаёт своё приложение на open.imoulife.com и даёт его ключи
  # accounts:
  #   - app_id: ${IMOU2_APP_ID:-}
  #     app_secret: ${IMOU2_APP_SECRET:-}
  #     home: Дом мамы
  #   - app_id: ${IMOU3_APP_ID:-}      # третий аккаунт — так же: ключи в .env, свой дом
  #     app_secret: ${IMOU3_APP_SECRET:-}
  #     home: Дача

# Группы «дом» в списке камер. Откуда берётся дом (сверху — главнее):
#   1. homes: ниже — по id камеры или по её названию;
#   2. home: у камеры в cameras / у аккаунта в imou.accounts;
#   3. imou.home — для камер основного аккаунта Imou;
#   4. дом из приложения Smart Life/Tuya — для камер Tuya.
# Камеры без дома попадают в «Другие камеры». id камер облаков: tuya_<device id>, imou_<серийник>
# (в нижнем регистре) — видны в /api/cameras или в статусе деплоя.
homes:
  Двор у мамы: Дом мамы      # по названию, как в приложении
  imou_ab12cd34: Дача        # по id
  tuya_bf1234567890abcd: Город

telegram:
  bot_token: ${TELEGRAM_BOT_TOKEN:-}
  mini_app_short_name: cams   # short name из BotFather /newapp
  channel_id: "@my_channel"   # куда /post_channel публикует кнопку

discord:
  bot_token: ${DISCORD_BOT_TOKEN:-}
  guild_ids: []               # ID серверов для мгновенной регистрации команд

admins:
  telegram: [111111111]
  discord: [222222222222222222]

allow:
  telegram: []
  discord: []

cameras:
  # Xiaomi Smart Camera C701 (H.265). Доступ по локальной сети (с VPS — через WireGuard на роутере).
  - id: c701_hall
    name: Прихожая
    type: xiaomi
    account: "1234567890"    # ID аккаунта Xiaomi (виден в WebUI go2rtc после входа)
    region: de
    host: 192.168.1.31
    did: "111111111"
    model: chuangmi.camera.079ae2
    home: Город              # дом этой камеры в списке
  - id: c701_room
    name: Комната
    type: xiaomi
    account: "1234567890"
    region: de
    host: 192.168.1.32
    did: "222222222"
    model: chuangmi.camera.079ae2
    home: Город
  - id: c701_yard
    name: Двор
    type: xiaomi
    account: "1234567890"
    region: de
    host: 192.168.1.33
    did: "333333333"
    model: chuangmi.camera.079ae2
    home: Город
    record_subtype: 1        # запись в архив с субпотока (меньше места); 0 — основной поток
  # Dahua/Imou по локальной сети (RTSP с регистратора или камеры)
  - id: dacha_gate
    name: Ворота на даче
    type: dahua
    host: 192.168.2.10
    user: admin
    password: ${DAHUA_PASSWORD:-}
    channel: 1
    subtype: 1               # 0 — основной поток, 1 — субпоток
    home: Дача
  # Любой RTSP-источник (или ffmpeg:...): камера у соседа, регистратор и т.п.
  - id: garage
    name: Гараж
    type: rtsp
    url: rtsp://user:${GARAGE_PASSWORD:-}@192.168.1.50:554/stream1
    home: Дом мамы
  - id: test
    name: Тестовый поток
    type: rtsp
    url: "ffmpeg:virtual?video&size=720#video=h264"
    record: false

recording:
  enabled: true
  timezone: Europe/Moscow
  start: "08:00"             # включительно
  end: "19:00"               # не включительно; файлы режутся по часам
  retention_days: 14
  min_free_gb: 15            # при нехватке места удаляются самые старые часы
  path: /recordings
  rtsp_url: rtsp://go2rtc:8554
  tuya: true                 # писать камеры Tuya (поток из облака — расходует трафик)
  imou: false                # писать камеры Imou: облако Imou ограничивает трафик, запись быстро его исчерпывает
  alert_minutes: 10
