[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "streemcam"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "websockets>=13",
    "aiogram>=3.13",
    "discord.py>=2.4",
    "pydantic>=2.8",
    "PyYAML>=6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
include = ["streemcam*"]

[tool.setuptools.package-data]
streemcam = ["web/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Silence starlette.testclient's httpx deprecation warning (third-party, not our code)
filterwarnings = ["ignore:Using.*httpx.*starlette.testclient.*deprecated"]
