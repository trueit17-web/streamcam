[Interface]
Address = ${INTERFACE}.1
ListenPort = 51820
PrivateKey = $(cat /config/server/privatekey-server)
# Контейнеры streemcam/go2rtc ходят к камерам из docker-сети: подменяем их адрес на адрес сервера в туннеле,
# иначе роутер дома отбросит пакеты (он ждёт из туннеля только 10.13.13.0/24). Порт 51820/udp открываем во
# входящем файрволе сервера (ufw и т.п.); файрвол провайдера VPS настраивается в его панели.
PostUp = iptables -I INPUT -p udp --dport 51820 -j ACCEPT; iptables -A FORWARD -i %i -j ACCEPT; iptables -A FORWARD -o %i -j ACCEPT; iptables -t nat -A POSTROUTING -o %i -j MASQUERADE
PostDown = iptables -D INPUT -p udp --dport 51820 -j ACCEPT; iptables -D FORWARD -i %i -j ACCEPT; iptables -D FORWARD -o %i -j ACCEPT; iptables -t nat -D POSTROUTING -o %i -j MASQUERADE
