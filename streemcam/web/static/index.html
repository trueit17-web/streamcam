<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Камеры</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <button id="back" hidden>← Назад</button>
    <h1 id="title">Камеры</h1>
    <button id="mode-archive" hidden>Архив</button>
    <button id="grid" hidden>Live</button>
  </header>
  <main>
    <p id="message" hidden></p>
    <ul id="cams" hidden></ul>
    <section id="viewer" hidden></section>
    <section id="archive" hidden>
      <div id="archive-days" class="chips"></div>
      <div id="archive-hours" class="chips"></div>
      <div id="archive-player" hidden>
        <video id="archive-video" controls playsinline preload="metadata" muted></video>
        <a id="archive-download" class="button" download>Скачать</a>
      </div>
      <p id="archive-empty" hidden></p>
    </section>
  </main>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
